<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../Terminal//css/style.css">
</head>
<body>
  <div id="app">

    <div id="login-screen" class="screen active">
      <h1>SECURE TERMINAL</h1>
      <input id="username" placeholder="Username">
      <input id="password" type="password" placeholder="Password">
      <button id="login-btn">LOGIN</button>
    </div>

    <div id="loading-screen" class="screen">
      <p id="loading-text">Authenticating</p>
    </div>

    <div id="terminal-screen" class="screen">
      <div class="terminal-output" id="output"></div>
      <div class="terminal-input">
        <span>&gt;</span>
        <input id="command-input" autocomplete="off">
      </div>
    </div>

    <div id="simulation-window" class="window">
      <div class="window-titlebar">
        <span class="window-title">Simulation</span>
        <button class="window-close">✕</button>
      </div>
      <iframe id="program-frame" src="programs/index.html"></iframe>
    </div>

  </div>
  <script src="../Terminal/js/main.js"></script>
</body>
</html>
