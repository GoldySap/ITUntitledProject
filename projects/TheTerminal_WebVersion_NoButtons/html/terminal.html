<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIREN Terminal</title>
    <link rel="stylesheet" href="../css/screen.css">
</head>
<style>
body {
    margin: 0;
    background: hsl(154 50% 5%);
    font-family: monospace;
    font-size: 16px;
    overflow: hidden;
    user-select: none;
}

#terminal-ui {
    display: none;
}

#header {
    padding: 10px;
}

.screen {
    display: none;
    height: 100vh;
    width: 100vw;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

input {
    background: #000;
    border: 1px solid #b68d40;
    font-family: monospace;
    padding: 5px;
}

input::placeholder {
    text-shadow: 0 0 2px #b68d40;
}

button {
    background: #b68d40;
    border: none;
    color: #000;
    text-shadow: 0 0 2px hsl(0, 0%, 0%);
    font-weight: bold;
    margin-top: 10px;
    padding: 5px 10px;
    cursor: pointer;
}

#text {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 300px;
}

#header, #input-area, #sidebar, #container {
    display: flex;
}

#terminal {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    white-space: pre-wrap;
}

#input-area {
    display: flex;
    bottom: 0;
    position: fixed;
    width: 100%;
    border-top: 1px solid #b68d40;
    background: rgba(0, 0, 0, 0.4);
    padding: 10px;
    align-items: center;
}

#command-input {
    display: flex;
    flex: 1;
    background: transparent;
    border: none;
    font-family: monospace;
    font-size: 1rem;
    outline: none;
}

#sidebar {
    width: 200px;
    padding: 10px;
    background: #000;
    border-left: 1px solid #b68d40;
}

#container {
    display: flex;
    flex: 1;
}

#loading-screen {
    display: flex;
    z-index: 500;
    position: absolute;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
}

#loading-text {
    font-size: 1.2em;
    text-align: center;
}

button.sidebar-button {
    display: block;
    width: 100%;
    margin-bottom: 5px;
    padding: 8px;
    background: #111;
    border: 1px solid #b68d40;
    font-family: monospace;
    cursor: pointer;
}

button.sidebar-button:hover {
    background: #b68d40;
    color: #000;
}

body, input, button.sidebar-button, #command-input {
    color: #b68d40;
}

body, #input-area, #command-input {
    text-shadow: 0 0 4px #b68d40;
}
</style>
<body>
<!-- SCREEN EFFECTS -->
<div class="screeneffects">
    <div id="interlaced"></div>  
    <div id="glare"></div>
</div>

<!-- LOADING SCREEN -->
<div id="loading-screen" class="">
    <div id="loading-text"></div>
</div>

<!-- MAIN TERMINAL UI -->
<div id="terminal-ui">
    <div id="header">
        <p><strong style="font-size: xx-large;">VIREN Terminal Prototype v1.4</strong><br><small>Type 'help' or use the interface</small></p>
    </div>
    <div id="container" class="visible">
        <div id="terminal">Welcome to VIREN Terminal v1.0</div>
            <div id="sidebar">
                <button onclick="runCommand('help')" class="sidebar-button level-0">Help</button>
                <button onclick="runCommand('auth 1')" class="sidebar-button level-0">Authorize Level 1</button>
                <button onclick="runCommand('auth 2')" class="sidebar-button level-1">Authorize Level 2</button>
                <button onclick="runCommand('simulate')" class="sidebar-button level-1">Launch Simulation</button>
                <button onclick="runCommand('clear')" class="sidebar-button level-0 level-1 level-2">Clear</button>
            </div>
        </div>
        <div id="input-area">
            <span>></span>
            <input type="text" id="command-input"/>
        </div>
    </div>
</div>
<script src="../JS/index.js"></script>
<script>
    addEventListener("DOMContentLoaded", (event) => {
        tui.style.display = "none";
        loadingScreen.style.display = "flex";
        loadtext = "Loading VIREN archive..."
        simulateLoading(() => {
            loadingScreen.style.display = "none";
            tui.style.display = "block";
            updateClearanceUI();
            loadtext = "";
            print("Login successful.");
        });
    })
</script>
</body>
</html>
